<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Jogo da Velha Futurista</title>
<style>
body{display:flex;flex-direction:column;align-items:center;background:#0d0d0d;color:#0ff;font-family:Arial,sans-serif}
#board{display:grid;grid-template:repeat(3,100px)/repeat(3,100px);gap:5px}
.cell{background:#111;border:2px solid #0ff;display:flex;align-items:center;justify-content:center;font-size:3rem;cursor:pointer}
.cell:hover{background:#222}
#msg{margin:10px}
#reset{margin-top:10px;padding:5px 10px;background:#0ff;color:#000;border:none;cursor:pointer}
</style>
</head>
<body>
<h1>Jogo da Velha</h1>
<div id="board"></div>
<div id="msg"></div>
<button id="reset">Recomeçar</button>
<script>
const board=document.getElementById('board')
const msg=document.getElementById('msg')
let turn='X', cells=[]
function init(){board.innerHTML='';cells=[];msg.textContent='';for(let i=0;i<9;i++){const c=document.createElement('div');c.className='cell';c.dataset.idx=i;c.addEventListener('click',play);board.appendChild(c);cells.push(c)}}
function play(e){const i=e.target.dataset.idx;if(cells[i].textContent) return;cells[i].textContent=turn;if(checkWin()){msg.textContent=`${turn} venceu!`;end()}else if(cells.every(c=>c.textContent)){msg.textContent='Empate!';end()}else turn=turn==='X'?'O':'X'}
function checkWin(){const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return lines.some(l=>cells[l[0]].textContent&&cells[l[0]].textContent===cells[l[1]].textContent&&cells[l[1]].textContent===cells[l[2]].textContent)}
function end(){cells.forEach(c=>c.removeEventListener('click',play))}
document.getElementById('reset').addEventListener('click',init)
init()
</script>
</body>
</html>
