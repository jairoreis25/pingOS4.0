# ── PingOS nginx (SPA + proxies same-origin) ─────────────────────────────
# - Serves the built static files with history-API fallback (react-router)
# - Proxies /whatsapp-api/* to the whatsapp bridge container
# - Proxies /api/* and /uploads/* to the MySQL API container
#
# Because everything is served from the same origin, the browser never needs
# CORS and never hits mixed-content (HTTPS page → HTTP API).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Used with a variable in proxy_pass so nginx starts
    # even if the `api` container is temporarily missing (without it, an
    # unresolvable upstream hostname makes nginx exit on boot).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript \
               application/x-javascript text/xml application/xml image/svg+xml;

    # Security-ish headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Static assets (hashed filenames — cache hard)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Runtime config: always fresh (see config.js.template / docker-entrypoint.sh)
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # WhatsApp bridge — same behavior as the Vite dev proxy
    location /whatsapp-api/ {
        proxy_pass http://whatsapp:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 25m;
    }

    # MySQL API — same origin, so VITE_API_URL can stay empty in production.
    # The request URI (/api/...) is forwarded as-is to the Express routes.
    location /api/ {
        set $pingos_api http://api:4000;
        proxy_pass $pingos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Alto de propósito: a restauração de backup envia o arquivo .json
        # inteiro por aqui (`POST /api/backups/upload`, até BACKUP_MAX_BYTES).
        client_max_body_size 512m;
    }

    # Ticket images stored by the API (formerly Convex storage)
    location /uploads/ {
        set $pingos_api http://api:4000;
        proxy_pass $pingos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    # SPA fallback: every unknown path serves index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html so deploys appear immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
